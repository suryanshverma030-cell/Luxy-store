
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUxy | Admin Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5f0e6;font-family:Arial,sans-serif}
header{background:#080808;padding:22px;border-bottom:1px solid #b99a54}
.logo{font-size:30px;letter-spacing:5px;color:#d6b76b}
.sub{color:#aaa;font-size:11px;letter-spacing:3px}
main{max-width:850px;margin:25px auto;padding:15px}
.panel{background:#191919;border:1px solid #66542d;border-radius:12px;padding:20px;margin-bottom:20px}
h2{color:#d6b76b}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:7px;font-size:15px}
input{background:#101010;color:white;border:1px solid #76633b}
button{background:#c6a65b;color:#111;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#292929;color:#e8d5a3;border:1px solid #76633b}
.danger{background:#8c2929;color:white}
.hidden{display:none!important}
#status,#loginStatus,#resetStatus{color:#e4c77f;white-space:pre-wrap;overflow-wrap:anywhere}
.product{border-bottom:1px solid #51452d;padding:15px 0}
.product img{width:80px;height:80px;object-fit:cover;border-radius:7px}
.productRow{display:flex;gap:13px;align-items:center}
.productInfo{flex:1;min-width:0;overflow-wrap:anywhere}
small{color:#c6a65b}
</style>
</head>
<body>

<header>
 <div class="logo">LUxy</div>
 <div class="sub">THE ART OF EVERYDAY LUXURY</div>
 <div class="sub">ADMIN CONTROL STUDIO</div>
</header>

<main>

<!-- LOGIN -->
<section class="panel" id="loginPanel">
 <h2>Admin Login</h2>
 <input id="email" type="email" placeholder="Admin email" autocomplete="username">
 <input id="password" type="password" placeholder="Password" autocomplete="current-password">
 <button id="loginBtn">LOGIN SECURELY</button>
 <button class="secondary" id="forgotBtn">FORGOT PASSWORD?</button>
 <p id="loginStatus"></p>
</section>

<!-- PASSWORD RESET -->
<section class="panel hidden" id="resetPanel">
 <h2>Reset Password</h2>
 <p>Enter your new admin password below.</p>
 <input id="newPassword" type="password" placeholder="New password" autocomplete="new-password">
 <input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password">
 <button id="resetBtn">UPDATE PASSWORD</button>
 <p id="resetStatus"></p>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

 <div class="panel">
  <h2>LUxy Dashboard</h2>
  <p>Admin access verified.</p>
  <button class="secondary" id="refreshBtn">REFRESH PRODUCTS</button>
  <button class="secondary" id="logoutBtn">LOGOUT</button>
 </div>

 <div class="panel">
  <h2 id="formTitle">Add New Product</h2>
  <form id="productForm">
   <input id="productName" placeholder="Product name" required>
   <input id="price" type="number" min="0" step="0.01" placeholder="Price in INR" required>
   <input id="category" placeholder="Category" required>
   <input id="imageUrl" type="url" placeholder="Product image URL" required>
   <input id="stock" type="number" min="0" step="1" placeholder="Stock quantity" required>
   <button id="saveBtn" type="submit">ADD PRODUCT</button>
   <button id="cancelBtn" class="secondary hidden" type="button">CANCEL EDIT</button>
  </form>
 </div>

 <div class="panel">
  <h2>Product Management</h2>
  <div id="products">Loading products...</div>
 </div>

</section>

<p id="status"></p>
</main>

<script>
const SUPABASE_URL = "https://gnbwmqxhahtwujplqzoc.supabase.co";
const SUPABASE_KEY = "sb_publishable_eagohtv5xeViT-ARla4kUQ_CWkGp3iD";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);

let editingId = null;
let recoveryMode = false;

function showOnly(panel){
 $("loginPanel").classList.add("hidden");
 $("resetPanel").classList.add("hidden");
 $("dashboard").classList.add("hidden");
 $(panel).classList.remove("hidden");
}

function status(message){
 $("status").textContent = message;
}

function validImageURL(value){
 try{
  const url = new URL(value);
  return url.protocol === "https:" || url.protocol === "http:";
 }catch{
  return false;
 }
}

// Check that logged-in user is an authorized admin
async function verifyAdmin(){
 const {data:{user},error:userError} = await db.auth.getUser();

 if(userError || !user) return false;

 const {data,error} = await db
  .from("admin_users")
  .select("user_id")
  .eq("user_id",user.id)
  .maybeSingle();

 if(error){
  status("Admin verification error: " + error.message);
  return false;
 }

 return !!data;
}

async function openDashboard(){
 const valid = await verifyAdmin();

 if(!valid){
  await db.auth.signOut();
  showOnly("loginPanel");
  $("loginStatus").textContent =
   "This account is not authorized as an admin.";
  return;
 }

 showOnly("dashboard");
 $("loginStatus").textContent = "";
 await loadProducts();
}

// LOGIN
$("loginBtn").onclick = async () => {
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || !password){
  $("loginStatus").textContent = "Enter email and password.";
  return;
 }

 $("loginBtn").disabled = true;
 $("loginStatus").textContent = "Checking login...";

 const {error} = await db.auth.signInWithPassword({
  email,password
 });

 $("loginBtn").disabled = false;

 if(error){
  $("loginStatus").textContent = error.message;
  return;
 }

 await openDashboard();
};

// FORGOT PASSWORD
$("forgotBtn").onclick = async () => {
 const email = $("email").value.trim();

 if(!email){
  $("loginStatus").textContent =
   "Enter your admin email first.";
  return;
 }

 $("forgotBtn").disabled = true;
 $("loginStatus").textContent = "Sending recovery email...";

 const {error} = await db.auth.resetPasswordForEmail(email,{
  redirectTo: window.location.origin +
   window.location.pathname
 });

 $("forgotBtn").disabled = false;

 $("loginStatus").textContent = error
  ? "Recovery error: " + error.message
  : "Recovery email sent. Open the latest email link.";
};

// RECOVERY LINK DETECTION
db.auth.onAuthStateChange((event) => {
 if(event === "PASSWORD_RECOVERY"){
  recoveryMode = true;
  showOnly("resetPanel");
  $("resetStatus").textContent =
   "Enter and confirm your new password.";
 }
});

// UPDATE PASSWORD
$("resetBtn").onclick = async () => {
 const password = $("newPassword").value;
 const confirm = $("confirmPassword").value;

 if(password.length < 8){
  $("resetStatus").textContent =
   "Password must be at least 8 characters.";
  return;
 }

 if(password !== confirm){
  $("resetStatus").textContent =
   "Passwords do not match.";
  return;
 }

 $("resetBtn").disabled = true;
 $("resetStatus").textContent = "Updating password...";

 const {error} = await db.auth.updateUser({
  password:password
 });

 $("resetBtn").disabled = false;

 if(error){
  $("resetStatus").textContent =
   "Password update failed: " + error.message;
  return;
 }

 $("resetStatus").textContent =
  "Password updated successfully. Please login.";

 await db.auth.signOut();
 recoveryMode = false;

 $("newPassword").value = "";
 $("confirmPassword").value = "";

 setTimeout(() => {
  showOnly("loginPanel");
 },1200);
};

// LOAD PRODUCTS
async function loadProducts(){
 const container = $("products");
 container.textContent = "Loading products...";

 const {data,error} = await db
  .from("Product")
  .select("*")
  .order("id",{ascending:false});

 if(error){
  container.textContent =
   "Product loading error: " + error.message;
  return;
 }

 if(!data || data.length === 0){
  container.textContent = "No products found.";
  return;
 }

 container.replaceChildren();

 data.forEach(p => {
  const card = document.createElement("div");
  card.className = "product";

  const row = document.createElement("div");
  row.className = "productRow";

  const img = document.createElement("img");
  img.alt = "Product image";
  img.src = validImageURL(p.image_url)
   ? p.image_url : "";
  img.onerror = () => img.style.display = "none";

  const info = document.createElement("div");
  info.className = "productInfo";

  const name = document.createElement("b");
  name.textContent = p.product_name || "Untitled Product";

  const details = document.createElement("p");
  details.textContent =
   "₹" + p.price + " | Stock: " + p.stock;

  const category = document.createElement("small");
  category.textContent = p.category || "";

  info.append(name,details,category);
  row.append(img,info);

  const edit = document.createElement("button");
  edit.className = "secondary";
  edit.textContent = "EDIT";
  edit.onclick = () => editProduct(p);

  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "DELETE";
  del.onclick = () => deleteProduct(p.id);

  card.append(row,edit,del);
  container.append(card);
 });
}

// ADD / EDIT PRODUCT
function resetForm(){
 editingId = null;
 $("productForm").reset();
 $("formTitle").textContent = "Add New Product";
 $("saveBtn").textContent = "ADD PRODUCT";
 $("cancelBtn").classList.add("hidden");
}

function editProduct(p){
 editingId = p.id;
 $("productName").value = p.product_name || "";
 $("price").value = p.price ?? "";
 $("category").value = p.category || "";
 $("imageUrl").value = p.image_url || "";
 $("stock").value = p.stock ?? "";

 $("formTitle").textContent = "Edit Product";
 $("saveBtn").textContent = "UPDATE PRODUCT";
 $("cancelBtn").classList.remove("hidden");

 window.scrollTo({top:0,behavior:"smooth"});
}

$("cancelBtn").onclick = resetForm;

$("productForm").onsubmit = async event => {
 event.preventDefault();

 const product = {
  product_name:$("productName").value.trim(),
  price:Number($("price").value),
  category:$("category").value.trim(),
  image_url:$("imageUrl").value.trim(),
  stock:Number($("stock").value)
 };

 if(!product.product_name || !product.category ||
    !validImageURL(product.image_url) ||
    !Number.isFinite(product.price) || product.price < 0 ||
    !Number.isInteger(product.stock) || product.stock < 0){
  status("Please check all product details.");
  return;
 }

 $("saveBtn").disabled = true;
 status("Saving product...");

 let result;

 if(editingId !== null){
  result = await db.from("Product")
   .update(product).eq("id",editingId);
 }else{
  result = await db.from("Product")
   .insert([product]);
 }

 $("saveBtn").disabled = false;

 if(result.error){
  status("Save failed: " + result.error.message);
  return;
 }

 status("Product saved successfully.");
 resetForm();
 await loadProducts();
};

// DELETE PRODUCT
async function deleteProduct(id){
 if(!confirm("Are you sure you want to delete this product?")){
  return;
 }

 const {error} = await db.from("Product")
  .delete().eq("id",id);

 if(error){
  status("Delete failed: " + error.message);
  return;
 }

 status("Product deleted successfully.");
 await loadProducts();
}

// REFRESH AND LOGOUT
$("refreshBtn").onclick = loadProducts;

$("logoutBtn").onclick = async () => {
 await db.auth.signOut();
 resetForm();
 showOnly("loginPanel");
 status("Logged out successfully.");
};

// CHECK EXISTING SESSION
db.auth.getSession().then(async ({data,error}) => {
 if(error || recoveryMode) return;

 if(data.session){
  await openDashboard();
 }
});
</script>
</body>
</html>
